<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Money Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --paper:#F3F5F9;--surface:#FFFFFF;--sunk:#E8ECF3;--ink:#161B2E;--ink2:#525A73;--ink3:#8A91A6;--line:rgba(22,27,46,.09);
  --blue:#2F45D8;--green:#128A5D;--red:#D63A2F;--violet:#6A4FE0;--amber:#B87700;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --text:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1220;--surface:#151B2D;--sunk:#1F2639;--ink:#EEF1F8;--ink2:#A9B0C4;--ink3:#6F7791;--line:rgba(255,255,255,.08);
  --blue:#7088FF;--green:#3DD39A;--red:#FF6A5C;--violet:#A08BFF;--amber:#FFB938;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1220;--surface:#151B2D;--sunk:#1F2639;--ink:#EEF1F8;--ink2:#A9B0C4;--ink3:#6F7791;--line:rgba(255,255,255,.08);
  --blue:#7088FF;--green:#3DD39A;--red:#FF6A5C;--violet:#A08BFF;--amber:#FFB938;color-scheme:dark}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;background:var(--paper)}
.top h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1}
.top h1 small{font-size:16px;font-weight:600;color:var(--ink3);letter-spacing:-.01em;margin-left:4px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);font-weight:600;margin-top:7px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync[data-s=saving] i,.sync[data-s=loading] i{background:var(--amber);animation:pulse 1s infinite}
.sync[data-s=offline] i{background:var(--red)}
.sync[data-s=demo] i{background:var(--violet)}
.tr{display:flex;gap:6px}
.mnav{display:flex;gap:6px}
.gear{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.gear svg{width:19px;height:19px}
.mnav button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.mnav button:disabled{opacity:.3}
.mnav svg{width:18px;height:18px}
.view{display:none}
.view.on{display:block}

/* home hero */
.hero{padding:4px 20px 0}
.hero .l1{font-size:14px;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between}
.hero .l1 b{color:var(--green);font-weight:700}
.hero .l1 b.low{color:var(--amber)}
.hero .big{font-family:var(--display);font-size:54px;font-weight:700;letter-spacing:-.05em;line-height:1.05;margin:2px 0 16px;font-feature-settings:"tnum" 1;white-space:nowrap}
.hero .big.neg{color:var(--red)}
.ribbon{display:flex;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden;gap:3px}
.ribbon i{display:block;height:100%;width:0;background:var(--c);border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.legend3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.legend3 small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:600}
.legend3 b{display:block;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.025em;margin-top:1px;white-space:nowrap}
.sw{width:9px;height:9px;border-radius:3px;background:var(--c);display:inline-block;flex:0 0 9px}
.sw.hollow{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--ink3)}

/* sections & panels */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 20px 10px}
.sec h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.025em}
.aside{font-size:13px;color:var(--ink3);font-weight:600}
.link{font-size:14px;font-weight:700;color:var(--blue)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:0 14px;padding:16px}
.panel+.panel{margin-top:12px}
.panel.list{padding:4px 0}
.panel h3{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.02em}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.neg{color:var(--red)}.okc{color:var(--green)}.warnc{color:var(--amber)}

/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:68px;right:16px;border-top:1px solid var(--line)}
.row:active{background:var(--sunk)}
.ic{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.ic.sm{width:32px;height:32px;flex-basis:32px;border-radius:10px;font-size:16px}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--ink3);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.amt{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em;white-space:nowrap;font-feature-settings:"tnum" 1}
.amt.inc{color:var(--green)}.amt.inv{color:var(--violet)}
.tag{font-size:11.5px;font-weight:700;color:var(--ink3)}
.dayh{display:flex;justify-content:space-between;padding:14px 16px 2px;font-size:13px;font-weight:700;color:var(--ink2)}
.dayh span+span{color:var(--ink3);font-weight:600}

/* stamps — the "paid" rubber stamp */
.stamp{display:inline-block;font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:2px solid var(--c);border-radius:5px;padding:2px 6px 1px;transform:rotate(-7deg);outline:1px solid var(--c);outline-offset:2px;white-space:nowrap;line-height:1.2;margin:3px 3px 3px 0}
.stamp.paid{--c:var(--green)}.stamp.over{--c:var(--red)}.stamp.today{--c:var(--amber)}
.stamp.thud{animation:thud .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes thud{0%{transform:scale(2.4) rotate(-20deg);opacity:0}55%{opacity:1}100%{transform:rotate(-7deg) scale(1)}}
.when{font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap}
.when.soon{color:var(--amber)}

/* due cards */
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.due{flex:0 0 86%;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.due:only-child{flex-basis:100%}
.due-top{display:flex;align-items:center;gap:12px}
.due .q{font-size:13.5px;color:var(--ink2);font-weight:600;margin:12px 0 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.billw{position:relative}
.billw+.billw::before{content:"";position:absolute;top:0;left:68px;right:16px;border-top:1px solid var(--line)}
.billw .acts{padding:0 16px 12px 68px}
.billw{position:relative}
.billw+.billw::before,.row+.billw::before,.billw+.row::before{content:"";position:absolute;top:0;left:68px;right:16px;border-top:1px solid var(--line)}
.btn{height:42px;border-radius:12px;font-weight:700;font-size:14px;background:var(--sunk);color:var(--ink);text-align:center;transition:transform .12s}
.btn.yes{background:var(--green);color:#fff}
.btn.wide{width:100%;margin-top:12px}
.btn:active{transform:scale(.97)}

/* bars */
.track{position:relative;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:7px}
.track.t8{height:8px}
.fill{display:block;height:100%;width:0;border-radius:99px;background:var(--c,var(--blue));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.fill.ok{--c:var(--green)}.fill.mid{--c:var(--amber)}.fill.bad{--c:var(--red)}
.pace,.target{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}
.target{opacity:.7}
.pct{font-family:var(--display);font-weight:800;font-size:15px}
.pct.ok{color:var(--green)}.pct.mid{color:var(--amber)}.pct.bad{color:var(--red)}
.set{font-weight:800;font-size:13.5px;color:var(--blue)}

/* home budget strip */
.bstrip{display:block;width:100%;text-align:left}
.bstrip .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bstrip b{font-weight:700}
.chipsx{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.oc{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--red) 12%,var(--surface));color:var(--red)}

/* insights */
.kgrid{display:grid;grid-template-columns:1fr 1fr}
.panel.kp{padding:0}
.k{padding:14px 16px}
.k:nth-child(odd){border-right:1px solid var(--line)}
.k:nth-child(-n+2){border-bottom:1px solid var(--line)}
.k small{font-size:12.5px;color:var(--ink3);font-weight:700}
.k b{display:block;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.035em;margin:1px 0}
.k em{font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:600}
.donut-wrap{position:relative;width:208px;height:208px;margin:2px auto 12px}
.donut{width:100%;height:100%;display:block}
.donut .seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-c small{font-size:12.5px;color:var(--ink3);font-weight:700}
.donut-c b{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.04em}
.lg{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;width:100%;padding:9px 0;text-align:left}
.lg+.lg{border-top:1px solid var(--line)}
.lgm{min-width:0}
.lgm .nm{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.lgm .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .v{text-align:right;font-family:var(--display);font-weight:700;font-size:15px}
.lg .v small{display:block;font-family:var(--text);color:var(--ink3);font-size:12px;font-weight:600}
.over-t{flex:0 0 auto;font-size:10.5px;font-weight:800;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px}
.bud{display:block;width:100%;text-align:left;padding:12px 0}
.bud+.bud{border-top:1px solid var(--line)}
.bud-top{display:flex;align-items:center;gap:10px}
.bk{margin:4px 0 14px}
.bk:last-child{margin-bottom:2px}
.bk-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700;gap:8px}
.bk-top small{color:var(--ink3);font-weight:600}
.mini{display:flex;gap:10px;font-size:12px;font-weight:700;color:var(--ink3);align-items:center}
.vbars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:6px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.col{width:40%;max-width:16px;height:0;border-radius:5px 5px 2px 2px;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.col.stack{display:flex;flex-direction:column-reverse;overflow:hidden}
.col.stack i{display:block;width:100%}
.vb small{font-size:11.5px;color:var(--ink3);font-weight:700}
.vb.cur small{color:var(--ink)}
.days{position:relative;display:flex;align-items:flex-end;gap:2px;height:110px}
.days i{flex:1;height:0;min-height:2px;background:var(--blue);border-radius:3px 3px 1px 1px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.days i.fut{background:var(--sunk)}
.days i.td{background:var(--red)}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink3);pointer-events:none}
.avgline span{position:absolute;right:0;bottom:2px;font-size:11px;font-weight:700;color:var(--ink2);background:var(--surface);padding:0 4px;border-radius:4px}
.days-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:6px}
.tip{display:flex;gap:12px;padding:4px 0 4px 12px;border-left:3px solid var(--tc,var(--ink3));margin:14px 0}
.tip.good{--tc:var(--green)}.tip.warn{--tc:var(--amber)}.tip.bad{--tc:var(--red)}.tip.info{--tc:var(--blue)}
.tip .ti{font-size:20px;line-height:1.3}
.tip b{display:block;font-size:14.5px;font-weight:800}
.tip p{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.fine{font-size:12px;color:var(--ink3);font-weight:600;margin-top:6px}

/* bills + budget */
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bstats small{font-size:12.5px;color:var(--ink3);font-weight:700}
.bstats b{display:block;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.03em}
.ring-row{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:100px;height:100px;flex:0 0 100px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .seg{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700}
.bigv{display:block;font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.035em;margin:1px 0}
.cta{display:block;width:calc(100% - 28px);margin:18px 14px 0;height:54px;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:15.5px;text-align:center}
details{margin-top:10px;background:var(--sunk);border-radius:12px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
details ol{margin:8px 0 2px 18px;font-size:13.5px;color:var(--ink2);line-height:1.6}
.empty{text-align:center;padding:30px 24px}
.empty .em{font-size:38px;margin-bottom:6px}
.empty b{display:block;font-size:16px;margin-bottom:4px}
.empty p{color:var(--ink3);font-size:13.5px;font-weight:600}
.skel{height:120px;border-radius:18px;margin:12px 14px 0;background:linear-gradient(90deg,var(--surface) 0%,var(--sunk) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear}

/* tab bar */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink3);padding:4px 0;transition:color .2s}
.tabbar svg{width:23px;height:23px}
.tabbar button.on{color:var(--blue)}
.tabbar .fab{width:60px;height:60px;margin:-30px auto 0;border-radius:20px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -8px var(--blue);transition:transform .15s}
.tabbar .fab:active{transform:scale(.92)}
.tabbar .fab svg{width:28px;height:28px}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(9,12,22,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;transform:translate(-50%,105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);z-index:50;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translate(-50%,0)}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--ink3);opacity:.35;margin:4px auto 12px}
.sheet h3{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.03em}
.sub{color:var(--ink3);font-size:13.5px;font-weight:600;margin-top:2px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.seg{display:flex;background:var(--sunk);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink2);padding:0 14px;text-align:center;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
#sh-add[data-type=Expense] #a-type .on{color:var(--red)}
#sh-add[data-type=Income] #a-type .on{color:var(--green)}
.amt-in{display:flex;align-items:center;justify-content:center;gap:2px;padding:14px 0 6px}
.amt-in span{font-family:var(--display);font-size:32px;font-weight:700;color:var(--ink3)}
.amt-in input{width:100%;max-width:270px;border:0;outline:0;background:transparent;font-family:var(--display);font-size:52px;font-weight:700;letter-spacing:-.045em;text-align:center;caret-color:var(--blue)}
.amt-in.sm input{font-size:38px}
.amt-in.sm span{font-size:26px}
.lbl{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 2px 8px}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px 9px;border-radius:14px;background:var(--sunk);text-align:center;transition:transform .12s,background .2s,box-shadow .2s}
.cat span{font-size:24px;line-height:1}
.cat small{font-size:11px;font-weight:700;color:var(--ink2);line-height:1.15}
.cat:active{transform:scale(.94)}
.cat.on{background:color-mix(in srgb,var(--c) 18%,var(--surface));box-shadow:inset 0 0 0 2px var(--c)}
.cat.on small{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{position:relative;height:38px;padding:0 13px;border-radius:11px;background:var(--sunk);font-weight:700;font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto;transition:background .2s,color .2s}
.chip small{font-size:11.5px;font-weight:700;opacity:.65}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.field{display:block;width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--sunk);padding:0 14px;font-weight:600;font-size:15px;outline:0;margin-top:12px}
.field:focus{border-color:var(--blue)}
.primary{display:block;width:100%;height:56px;border-radius:16px;margin-top:18px;font-weight:800;font-size:16px;color:#fff;background:var(--blue);text-align:center;transition:transform .12s}
.primary.green{background:var(--green)}
.primary:active{transform:scale(.98)}
.ghost{display:block;width:100%;height:46px;margin-top:6px;border-radius:13px;font-weight:700;color:var(--ink2);text-align:center}
.del{height:36px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13.5px;background:var(--sunk);color:var(--red)}
.del.arm{background:var(--red);color:#fff}
.more-t{display:block;margin:14px auto 0;font-weight:700;font-size:14px;color:var(--blue)}
#a-more.closed{display:none}
.switch{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-weight:700}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:48px;height:28px;border-radius:99px;background:var(--sunk);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .25s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{transform:translateX(20px)}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.25,1);z-index:90;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--red);color:#fff}
.wiggle{animation:wig .4s}
@keyframes wig{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pulse{50%{opacity:.3}}

/* settings */
.sgroup{background:var(--sunk);border-radius:16px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;color:var(--ink);text-decoration:none;text-align:left;position:relative}
.srow+.srow,.srow+.spad{border-top:1px solid var(--line)}
.srow .rt small{white-space:normal}
.srow.switch{margin:0;cursor:pointer}
.switch i{flex:0 0 48px}
.switch input:disabled+i{opacity:.4}
.spad{padding:12px 14px 14px}
.spad>small{display:block;color:var(--ink2);font-size:13px;font-weight:600;line-height:1.45}
.spad .field{background:var(--surface)}
.spad .btn{background:var(--ink);color:var(--paper)}
.spad .btn:disabled{opacity:.6}
.copy{display:flex;gap:8px}
.copy .field{flex:1;min-width:0;font-size:13px}
.copy .btn{margin-top:12px;height:48px;padding:0 16px}
.spad details{background:var(--surface)}
.dl{display:block;width:100%;height:48px;margin-top:20px;text-align:center}

/* lock screen */
body.locked>:not(#lock):not(#toast){visibility:hidden}
#lock{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.25,1)}
#lock.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.lk{width:100%;max-width:340px;text-align:center;margin:auto}
.lk-logo{width:64px;height:64px;border-radius:20px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-family:var(--display);font-size:32px;font-weight:800;box-shadow:0 12px 26px -12px var(--blue)}
.lk-logo svg{width:34px;height:34px}
.lk h2{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.lk .sub{font-size:14px;margin-top:6px}
.lk .field{text-align:left;margin-top:22px;font-size:14px}
.lk .primary{margin-top:22px}
.lk ol{text-align:left;margin:18px 0 0 20px;font-size:14px;color:var(--ink2);line-height:1.6;font-weight:600}
.dots{display:flex;justify-content:center;gap:18px;margin:30px 0 10px;transition:opacity .2s}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink3);transition:background .15s,border-color .15s,transform .15s}
.dots i.on{background:var(--ink);border-color:var(--ink);transform:scale(1.12)}
.dots.ok i{background:var(--green);border-color:var(--green)}
.dots.busy{animation:pulse 1s infinite}
.lk-err{min-height:20px;color:var(--red);font-weight:700;font-size:13.5px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px 28px;justify-content:center;margin-top:14px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-size:28px;font-weight:600;display:grid;place-items:center;text-align:center;color:var(--ink);transition:transform .1s,background .15s}
.pad button:active{transform:scale(.9);background:var(--sunk)}
.pad .x{background:none;border:0;color:var(--ink2)}
.pad .x svg{width:30px;height:30px}
.pad .t{font-family:var(--text);font-size:14px;font-weight:700}
.pad [data-k=bio]{color:var(--blue)}
.lk-link{margin-top:16px;font-weight:700;font-size:14px;color:var(--blue)}
@media (max-height:660px){.lk-logo{display:none}.dots{margin-top:20px}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const API_URL = '';

/* =====================================================================

const MODES = [['UPI', '📱'], ['Card', '💳'], ['Cash', '💵'], ['Bank', '🏦']];

const FIXED = new Set(['Rent', 'EMI & Loans', 'Insurance', 'Taxes', 'Household Help']);

  { name: 'Mutual fund SIP', category: 'Investments & SIP', every: 1 },
  { name: 'Netflix', category: 'Subscriptions', every: 1 },
  { name: 'Rent', category: 'Rent', every: 1 },

];
const CAT = {};
Object.keys(CATS).forEach(type => CATS[type].forEach(([name, em, c, b]) => { CAT[name] = { name, em, c, b: b || 'I', type }; }));
function catOf(name, type) {
  return CAT[name] || { name: name || 'Others', em: type === 'Income' ? '💰' : '📦', c: '#A0A6B5', b: type === 'Income' ? 'I' : 'W', type: type || 'Expense' };
}

/* ============================== utils ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const p = String(s || '').slice(0, 10).split('-').map(Number); return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1); };
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0, 7);
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dim = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const shiftMonth = (ym, n) => { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDate = s => { const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const dayLabel = s => { const n = diffDays(today(), s); if (n === 0) return 'Today'; if (n === -1) return 'Yesterday'; const d = parse(s); return DOW[d.getDay()] + ', ' + fmtDate(s); };
const monthShort = ym => MON[+ym.slice(5, 7) - 1];
const advance = (s, every, dueDay) => {
  const ym = shiftMonth(String(s).slice(0, 7), +every || 1);
  return ym + '-' + pad(Math.min(+dueDay || +String(s).slice(8, 10) || 1, dim(ym)));
};
const NF0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inr = n => { n = Number(n) || 0; const r = Math.round(Math.abs(n) * 100) / 100; return (n < 0 && r > 0 ? '−' : '') + '₹' + (Number.isInteger(r) ? NF0 : NF2).format(r); };
const inrS = n => {
  n = Number(n) || 0; const a = Math.abs(n), s = n < 0 ? '−' : '';
  const f = (v, u) => s + '₹' + (+v.toFixed(v < 10 ? 1 : 0)) + u;
  return a >= 1e7 ? f(a / 1e7, 'Cr') : a >= 1e5 ? f(a / 1e5, 'L') : a >= 1e3 ? f(a / 1e3, 'K') : s + '₹' + Math.round(a);
};
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const parseAmt = s => { const v = parseFloat(String(s || '').replace(/[^\d.]/g, '')); return isFinite(v) ? Math.round(v * 100) / 100 : 0; };
const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x), 0);
const nowIso = () => { const d = new Date(); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const haptic = n => { try { navigator.vibrate && navigator.vibrate(n || 10); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const band = (p, pace = 100) => p > 100 ? 'bad' : (p >= 85 || p > pace + 8) ? 'mid' : 'ok';
const BANDC = { ok: 'okc', mid: 'warnc', bad: 'neg' };

/* ============================== state ============================== */
const GAS = !!(window.google && google.script && google.script.run); // opened from the Apps Script link
let apiUrl = GAS ? '' : (API_URL || store.get('mt-api', '') || '');
let MODE = ''; // 'gas' · 'api' (hosted app) · 'local' (data stays on this device) · 'demo' (sample data)
const onDevice = () => MODE === 'local' || MODE === 'demo'; // no server — everything lives in this browser
const cacheKey = () => (MODE === 'demo' ? 'mt-demo' : MODE === 'local' ? 'mt-local' : 'mt-cache');

const saveAuth = () => store.set('mt-auth', AUTH);
let unlocked = false, lastLoad = 0;
const S = { tx: [], rec: [], bud: {}, url: '', sheetUrl: '', sheetEmail: '', month: thisMonth(), tab: 'home', ready: false, justPaid: null };
let Q = [];
let ver = 0;

function persist() {

}
function put(arr, o) { const i = arr.findIndex(x => x.id === o.id); if (i > -1) arr[i] = o; else arr.unshift(o); }

/* ======================= Google Sheets sync ======================= */
const SYNC = { ok: 'Synced to Google Sheets', saving: 'Saving…', loading: 'Loading…', offline: 'Offline — will sync later', demo: 'Preview with sample data', local: 'Saved on this device' };
function setSync(s) {
  if (onDevice()) s = MODE;
  const el = $('#sync'); el.dataset.s = s;
  el.lastElementChild.textContent = SYNC[s] + (s === 'offline' && Q.length ? ' · ' + Q.length + ' pending' : '');
}
function apiErr(r) { const e = new Error((r && r.error) || 'Something went wrong'); e.code = (r && r.code) || 'ERR'; return e; }
/* One envelope for both transports: google.script.run (Apps Script link) or fetch (hosted app) */
function rpc(fn, args, extra) {
  const req = Object.assign({ fn, args: args || [], token: AUTH.token || '' }, extra || {});
  if (GAS) {
    return new Promise((res, rej) => google.script.run
      .withSuccessHandler(r => (r && r.ok ? res(r.data) : rej(apiErr(r))))
      .withFailureHandler(rej).api(req));
  }
  const ctl = window.AbortController ? new AbortController() : null, tm = ctl && setTimeout(() => ctl.abort(), 45000);
  return fetch(apiUrl, { method: 'POST', redirect: 'follow', body: JSON.stringify(req), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl ? ctl.signal : undefined })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(r => (r && r.ok ? r.data : Promise.reject(apiErr(r))))
    .catch(e => { throw (e && e.name === 'AbortError') ? new Error('Network timeout') : e; })
    .finally(() => { if (tm) clearTimeout(tm); });
}
const call = (fn, ...args) => rpc(fn, args);
const isNet = e => !navigator.onLine || /network|connection|http 0|timeout|failed to fetch|load failed|aborted/i.test(String((e && (e.message || e)) || ''));
function enqueue(fn, ...args) {
  ver++; persist();

  Q.push({ fn, args, tries: 0 }); store.set('mt-q', Q); flush();
}
let flushing = false, retryT = 0;
async function flush() {
  if (!MODE || onDevice() || flushing || !AUTH.token || !unlocked) return;
  if (!Q.length) { setSync('ok'); return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  flushing = true; setSync('saving');
  while (Q.length) {
    const op = Q[0];
    try {
      await call(op.fn, ...op.args);
      Q.shift(); store.set('mt-q', Q);
    } catch (e) {
      const msg = String((e && e.message) || e);
      flushing = false; clearTimeout(retryT);
      if (e && e.code === 'AUTH') { authLost(); return; }
      if (isNet(e)) {
        setSync('offline'); retryT = setTimeout(flush, 15000); return;
      }
      op.tries = (op.tries || 0) + 1;
      if (op.tries >= 4) { Q.shift(); toast('Couldn’t save to Sheets: ' + msg, true); }
      store.set('mt-q', Q);

    }
  }
  flushing = false; setSync('ok');
}
async function load() {
  if (!MODE || onDevice() || !AUTH.token || !unlocked) return;
  lastLoad = Date.now();
  await flush();
  if (Q.length || flushing) return;
  const v = ver;
  if (!S.ready) setSync('loading');
  try {
    const d = await call('getAll');
    if (Q.length || v !== ver) return;
    S.tx = d.tx || []; S.rec = d.rec || []; S.bud = d.bud || {}; S.url = d.url || S.url;
    S.sheetUrl = d.sheetUrl || S.sheetUrl; S.sheetEmail = d.sheetEmail || '';
    S.ready = true; persist(); setSync('ok'); render();
  } catch (e) {
    if (e && e.code === 'AUTH') { authLost(); return; }
    setSync(isNet(e) ? 'offline' : 'ok');
    if (!S.ready) { S.ready = true; render(); }
    toast(isNet(e) ? 'Couldn’t reach Google Sheets — showing saved data' : String(e.message || e), true);
  }
}

/* ===================== animated values & bars ===================== */
const P = {};
const FMT = { inr: v => inr(Math.round(v)), inrS: v => inrS(v), pct: v => Math.round(v) + '%' };
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, +v || 0));
function W(k, w, extra = '') { w = clamp(w); return `data-k="${esc(k)}" data-w="${w.toFixed(2)}" style="width:${P[k] == null ? 0 : P[k]}%;${extra}"`; }
function H(k, h, extra = '') { h = clamp(h); return `data-k="${esc(k)}" data-h="${h.toFixed(2)}" style="height:${P[k] == null ? 0 : P[k]}%;${extra}"`; }
function N(k, v, f = 'inr') { const from = P[k] == null ? 0 : P[k]; return `<span data-k="${esc(k)}" data-count="${v}" data-fmt="${f}">${FMT[f](from)}</span>`; }
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(e) {
  const k = e.dataset.k, to = +e.dataset.count, f = FMT[e.dataset.fmt] || FMT.inr, from = P[k] == null ? 0 : P[k];
  P[k] = to;
  if (from === to || reduced()) { e.textContent = f(to); return; }
  const t0 = performance.now(), dur = 750;
  const step = t => { const p = Math.min(1, (t - t0) / dur), q = 1 - Math.pow(1 - p, 3); e.textContent = f(from + (to - from) * q); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function animate(root) {
  void root.offsetWidth;
  requestAnimationFrame(() => {
    $$('[data-w]', root).forEach(e => { e.style.width = e.dataset.w + '%'; P[e.dataset.k] = +e.dataset.w; });
    $$('[data-h]', root).forEach(e => { e.style.height = e.dataset.h + '%'; if (e.dataset.k) P[e.dataset.k] = +e.dataset.h; });
    $$('[data-da]', root).forEach(e => { e.style.strokeDasharray = e.dataset.da; P[e.dataset.k] = e.dataset.da; });
    $$('[data-count]', root).forEach(countUp);
  });
}

/* ============================== stats ============================== */
function monthStats(ym) {
  const r = { income: 0, spent: 0, invested: 0, byCat: {}, incCat: {}, b: { N: 0, W: 0, S: 0 }, byDay: {}, daily: 0, tx: [] };
  for (const t of S.tx) {
    if (String(t.date).slice(0, 7) !== ym) continue;
    r.tx.push(t);
    const a = +t.amount || 0;
    if (t.type === 'Income') { r.income += a; r.incCat[t.category] = (r.incCat[t.category] || 0) + a; continue; }
    const c = catOf(t.category, 'Expense');
    r.byCat[c.name] = (r.byCat[c.name] || 0) + a;
    r.b[c.b === 'S' ? 'S' : c.b === 'N' ? 'N' : 'W'] += a;
    if (c.b === 'S') { r.invested += a; continue; }
    r.spent += a;
    if (!FIXED.has(c.name) && t.source !== 'Recurring') { const d = +String(t.date).slice(8, 10); r.byDay[d] = (r.byDay[d] || 0) + a; r.daily += a; }
  }
  r.out = r.spent + r.invested;
  r.left = r.income - r.out;
  r.rate = r.income > 0 ? (r.income - r.spent) / r.income * 100 : null;
  return r;
}
/* average of the last 3 months (before the current month) that have any entries */
function avg3(fn) {
  const cm = thisMonth(), months = [1, 2, 3].map(k => shiftMonth(cm, -k)).filter(ym => S.tx.some(t => String(t.date).slice(0, 7) === ym));
  if (!months.length) return 0;
  return sum(months, ym => fn(monthStats(ym))) / months.length;
}
function recStatus(r) {
  const td = today();
  if (!r.active) return { k: 'off', d: 1e9, eff: r.nextDue, html: '<span class="when">Paused</span>' };
  const eff = r.snoozed || r.nextDue || td, d = diffDays(td, eff);
  const paid = r.lastPaid && eff.slice(0, 7) > td.slice(0, 7) && diffDays(r.lastPaid, td) < 32;
  if (paid) return { k: 'paid', d, eff, html: '<span class="stamp paid">Paid</span>' };
  if (d < 0) return { k: 'due', over: true, d, eff, html: `<span class="stamp over">Overdue ${-d}d</span>` };
  if (d === 0) return { k: 'due', d, eff, html: '<span class="stamp today">Due today</span>' };
  if (d <= 5) return { k: 'soon', d, eff, html: `<span class="when soon">${d === 1 ? 'Tomorrow' : 'In ' + d + ' days'}</span>` };
  return { k: 'later', d, eff, html: `<span class="when">In ${d} days</span>` };
}
const monthlyCost = r => (+r.amount || 0) / (+r.every || 1);

/* ============================== views ============================== */
const freqLabel = r => FREQ[r.every] || 'Every ' + r.every + ' months';

const byD = (a, b) => a.st.d - b.st.d;

function txRow(t, showDate) {
  const inc = t.type === 'Income', c = catOf(t.category, t.type), inv = c.b === 'S';
  const sub = [t.note ? c.name : '', t.mode, t.source === 'Recurring' ? 'Bill/SIP' : '', showDate ? fmtDate(t.date) : ''].filter(Boolean).join(' · ');
  return `<button class="row" data-tx="${esc(t.id)}"><div class="ic" style="--c:${c.c}">${c.em}</div>` +
    `<div class="rt"><b>${esc(t.note || c.name)}</b><small>${esc(sub || c.name)}</small></div>` +
    `<div class="rr"><span class="amt ${inc ? 'inc' : inv ? 'inv' : ''}">${inc ? '+' : '−'}${inr(t.amount)}</span></div></button>`;

function dueCard(r, st, jp) {
  const c = catOf(r.category), done = jp && jp.id === r.id;
  const top = `<div class="due-top"><div class="ic" style="--c:${c.c}">${c.em}</div><div class="rt"><b>${esc(r.name)}</b><small>${inr(r.amount)} · ${freqLabel(r)}</small></div>` +
    (done ? `<span class="stamp paid${jp.thud ? ' thud' : ''}">Paid</span>` : st.html) + '</div>';
  if (done) return `<div class="due">${top}<p class="q" style="margin-bottom:2px">Added to expenses · next due ${fmtDate(r.nextDue)}</p></div>`;
  return `<div class="due">${top}<p class="q">${st.k === 'soon' ? `Due ${fmtDate(st.eff)} — paid already?` : 'Did you pay this?'}</p>` +
    `<div class="acts"><button class="btn yes" data-pay="${esc(r.id)}">✓ Yes, paid</button><button class="btn" data-snz="${esc(r.id)}">Reschedule</button></div></div>`;
}

function vHome() {

    <div class="big ${m.left < 0 ? 'neg' : ''}">${N('h-left', m.left)}</div>
    <div class="ribbon">${m.spent ? `<i ${W('h-rs', m.spent / base * 100, '--c:var(--red)')}></i>` : ''}${m.invested ? `<i ${W('h-ri', m.invested / base * 100, '--c:var(--violet)')}></i>` : ''}</div>
    <div class="legend3">

    h += `<div class="sec"><h2>Budgets</h2><button class="link" data-go="budget">Manage</button></div>
    <div class="panel"><button class="bstrip" data-go="budget">
      <div class="top2"><span><b>${inr(used)}</b> <span class="aside">of ${inr(lim)}</span></span><span class="pct ${bd}">${Math.round(p)}%</span></div>
      <div class="track t8"><i class="fill ${bd}" ${W('h-bud', p)}></i>${cur ? `<span class="pace" style="left:${pace.toFixed(1)}%"></span>` : ''}</div>
      ${over.length ? `<div class="chipsx">${over.map(k => `<span class="oc">${catOf(k).em} ${esc(k)} +${inr(m.byCat[k] - S.bud[k])}</span>`).join('')}</div>`
        : `<p class="fine">${inr(lim - used)} left${cur ? ` · ${dl} day${dl === 1 ? '' : 's'} to go` : ''} · every category within its limit</p>`}
    </button></div>`;

function vStats() {
  const ym = S.month, m = monthStats(ym), cur = ym === thisMonth(), pym = shiftMonth(ym, -1), pm = monthStats(pym);
  const D = dim(ym), el = cur ? +today().slice(8) : D, pace = cur ? el / D * 100 : 100;
  if (!m.tx.length) return `<div class="panel" style="margin-top:6px"><div class="empty"><div class="em">📊</div><b>Nothing to analyse yet</b><p>Add a few entries for ${MONTHS[+ym.slice(5, 7) - 1]} and your charts appear here.</p></div></div>`;
  let h = '';

  /* KPIs */
  const ch = pm.spent ? (m.spent - pm.spent) / pm.spent * 100 : null, avg = m.daily / el, srcs = Object.keys(m.incCat).length;
  h += `<div class="panel kp" style="margin-top:6px"><div class="kgrid">
    <div class="k"><small>Spent</small><b>${N('s-sp', m.spent)}</b><em>${ch == null ? 'excl. investments' : `<span class="${ch > 0 ? 'neg' : 'okc'}">${ch > 0 ? '▲' : '▼'} ${Math.abs(Math.round(ch))}%</span> vs ${monthShort(pym)}`}</em></div>

    <div class="k"><small>Savings rate</small><b class="${m.rate == null ? '' : m.rate >= 20 ? 'okc' : m.rate >= 0 ? 'warnc' : 'neg'}">${m.rate == null ? '—' : N('s-rate', m.rate, 'pct')}</b><em>target 20%+</em></div>
    <div class="k"><small>Day-to-day</small><b>${N('s-avg', avg)}</b><em>${cur ? 'per day · pace ' + inrS(avg * D) : 'avg per day'}</em></div>
  </div></div>`;

  /* donut: where it went */

  if (m.out > 0) {
    const R = 80, C = 2 * Math.PI * R, gap = cats.length > 1 ? 2 : 0, max = cats[0][1];
    let acc = 0;
    const segs = cats.map(([k, v]) => {
      const f = v / m.out, len = Math.max(0, f * C - gap), off = -acc * C, key = 'dn-' + k; acc += f;
      return `<circle class="seg" cx="100" cy="100" r="${R}" fill="none" stroke-width="26" data-k="${esc(key)}" data-da="${len.toFixed(2)} ${C.toFixed(2)}" style="stroke:${catOf(k).c};stroke-dasharray:${P[key] || '0 ' + C.toFixed(2)};stroke-dashoffset:${off.toFixed(2)}"/>`;
    }).join('');
    h += `<div class="sec"><h2>Where it went</h2><span class="aside">tap to set a limit</span></div><div class="panel">
      <div class="donut-wrap"><svg class="donut" viewBox="0 0 200 200" aria-hidden="true"><g transform="rotate(-90 100 100)"><circle cx="100" cy="100" r="${R}" fill="none" stroke-width="26" style="stroke:var(--sunk)"/>${segs}</g></svg>
      <div class="donut-c"><small>Total out</small><b>${N('s-out', m.out, 'inrS')}</b><small>${cats.length} categor${cats.length === 1 ? 'y' : 'ies'}</small></div></div>` +
      cats.map(([k, v]) => {
        const c = catOf(k), lim = S.bud[k] || 0, over = lim > 0 && v > lim, pct = v / m.out * 100;
        return `<button class="lg" data-bud="${esc(k)}"><div class="ic sm" style="--c:${c.c}">${c.em}</div><div class="lgm"><div class="nm"><span>${esc(k)}</span>${over ? '<i class="over-t">OVER</i>' : ''}</div>` +
          `<div class="track"><i class="fill" ${W('lg-' + k, v / max * 100, '--c:' + c.c)}></i></div></div>` +
          `<div class="v">${inr(v)}<small>${pct < 1 ? '<1' : Math.round(pct)}%${lim ? ' · limit ' + inrS(lim) : ''}</small></div></button>`;
      }).join('') + '</div>';
  }

  /* budget vs actual */
  const bk = Object.keys(S.bud).filter(k => S.bud[k] > 0);
  h += `<div class="sec"><h2>Budget vs actual</h2>${bk.length ? '<button class="link" data-go="budget">Edit</button>' : ''}</div><div class="panel">`;
  if (bk.length) {
    h += bk.map(k => [k, m.byCat[k] || 0, S.bud[k]]).sort((a, b) => b[1] / b[2] - a[1] / a[2]).map(([k, v, lim]) => {
      const p = v / lim * 100, bd = band(p, pace);
      return `<div class="bk"><div class="bk-top"><span>${catOf(k).em} ${esc(k)}</span><small><b class="${BANDC[bd]}">${inr(v)}</b> of ${inr(lim)}</small></div>` +
        `<div class="track t8"><i class="fill ${bd}" ${W('bv-' + k, p)}></i>${cur ? `<span class="pace" style="left:${pace.toFixed(1)}%"></span>` : ''}</div></div>`;
    }).join('');
    if (cur) h += '<p class="fine">The thin line marks how far into the month you are — a bar past it is spending ahead of pace.</p>';
  } else {
    h += '<p class="fine" style="margin:0">Set a monthly limit per category to see when one goes over.</p><button class="btn wide" data-go="budget">Set budgets</button>';
  }
  h += '</div>';

  /* 50/30/20 */
  h += '<div class="sec"><h2>50 / 30 / 20 check</h2><span class="aside">share of income</span></div><div class="panel">';
  if (m.income > 0) {
    const n = m.b.N / m.income * 100, w = m.b.W / m.income * 100, s = (m.income - m.b.N - m.b.W) / m.income * 100;
    const row = (lbl, hint, v, tgt, t, bd, key) => `<div class="bk"><div class="bk-top"><span>${lbl} <small>${hint}</small></span><small><b class="${BANDC[bd]}">${Math.round(v)}%</b> · ${tgt}</small></div>` +
      `<div class="track t8"><i class="fill ${bd}" ${W(key, v)}></i><span class="target" style="left:${t}%"></span></div></div>`;
    h += row('Needs', 'rent, bills, groceries', n, 'target ≤50%', 50, n > 60 ? 'bad' : n > 50 ? 'mid' : 'ok', 'r-n') +
      row('Wants', 'dining, shopping, fun', w, 'target ≤30%', 30, w > 40 ? 'bad' : w > 30 ? 'mid' : 'ok', 'r-w') +
      row('Savings', 'invested + unspent', s, 'target ≥20%', 20, s < 10 ? 'bad' : s < 20 ? 'mid' : 'ok', 'r-s');
  } else h += '<p class="fine" style="margin:0">Add this month’s income to see how spending splits into needs, wants and savings.</p>';
  h += '</div>';

  /* 6-month trend */
  const ms = [5, 4, 3, 2, 1, 0].map(k => shiftMonth(ym, -k)), st = ms.map(monthStats), mx = Math.max(1, ...st.map(x => Math.max(x.income, x.out)));
  const lg = (c, t) => `<span style="display:inline-flex;align-items:center;gap:5px"><i class="sw" style="--c:${c}"></i>${t}</span>`;
  h += `<div class="sec"><h2>6-month trend</h2></div><div class="panel"><div class="mini" style="margin-bottom:6px">${lg('var(--green)', 'Income')}${lg('var(--red)', 'Spent')}${lg('var(--violet)', 'Invested')}</div>
    <div class="vbars">${ms.map((y, i) => {
      const x = st[i];
      return `<div class="vb ${y === ym ? 'cur' : ''}"><div class="pair"><i class="col" ${H('tr-i' + i, x.income / mx * 100, 'background:var(--green)')}></i>` +
        `<i class="col stack" ${H('tr-o' + i, x.out / mx * 100)}><i style="height:${x.out ? x.spent / x.out * 100 : 0}%;background:var(--red)"></i><i style="height:${x.out ? x.invested / x.out * 100 : 0}%;background:var(--violet)"></i></i></div><small>${monthShort(y)}</small></div>`;
    }).join('')}</div></div>`;

  /* day-to-day */
  const dv = Array.from({ length: D }, (_, i) => m.byDay[i + 1] || 0), dmx = Math.max(0, ...dv), tdd = +today().slice(8);
  if (dmx > 0) {
    h += `<div class="sec"><h2>Day-to-day spending</h2></div><div class="panel"><div class="days">${dv.map((v, i) => `<i class="${cur && i + 1 > tdd ? 'fut' : cur && i + 1 === tdd ? 'td' : ''}" ${H('dy-' + i, v / dmx * 100)} title="${i + 1} ${monthShort(ym)}: ${inr(v)}"></i>`).join('')}` +
      `<div class="avgline" style="bottom:${(avg / dmx * 100).toFixed(1)}%"><span>avg ${inrS(avg)}/day</span></div></div>` +
      `<div class="days-x"><span>1</span><span>${Math.round(D / 3)}</span><span>${Math.round(2 * D / 3)}</span><span>${D}</span></div>` +
      '<p class="fine">Excludes rent, EMIs, insurance, tax, house help and bills/SIPs.</p></div>';
  }

  /* biggest spends */
  const big = m.tx.filter(t => t.type !== 'Income' && catOf(t.category).b !== 'S').sort((a, b) => b.amount - a.amount).slice(0, 5);
  if (big.length) h += `<div class="sec"><h2>Biggest spends</h2></div><div class="panel list">${big.map(t => txRow(t, true)).join('')}</div>`;

  /* coach */
  h += `<div class="sec"><h2>Money coach</h2><span class="aside">${MONTHS[+ym.slice(5, 7) - 1]}</span></div><div class="panel">` +
    coach(m, ym, cur).map(t => `<div class="tip ${t[0]}"><div class="ti">${t[1]}</div><div><b>${t[2]}</b><p>${t[3]}</p></div></div>`).join('') +
    '<p class="fine">Rule-of-thumb guidance based on your entries — not personalised financial advice.</p></div>';
  return h;
}

function coach(m, ym, cur) {
  const T = [], add = (cls, ic, t, p) => T.push([cls, ic, t, p]);
  const D = dim(ym), el = cur ? +today().slice(8) : D, sofar = cur ? ' so far' : '';

  if (m.income > 0) {
    const r = Math.round(m.rate);
    if (m.rate < 0) add('bad', '🚨', 'Spending is higher than income', `You’ve spent ${inr(m.spent - m.income)} more than you earned. Pause wants — shopping, dining out, entertainment — until the next salary, and don’t bridge the gap with credit-card debt.`);
    else if (m.rate < 20) add('warn', '⚠️', `Savings rate is ${r}%${sofar}`, `Aim for 20% or more: keep spending under ${inr(m.income * 0.8)}, which is ${inr(Math.max(0, m.spent - m.income * 0.8))} less than now.`);
    else if (m.rate >= 35) add('good', '🏆', `You’re keeping ${r}% of income${sofar}`, 'Well above the 20% benchmark. Make sure the surplus is actually invested (SIP step-up or a lump sum), not idling in a savings account.');
    else add('good', '✅', `Healthy savings rate: ${r}%${sofar}`, 'Above the 20% benchmark. Hold this rate as income grows — watch for lifestyle creep after hikes.');
  } else if (m.out > 0) add('info', '💡', 'No income logged this month', 'Add your salary or other income so the savings rate and 50/30/20 split can be calculated.');

  const bk = Object.keys(S.bud).filter(k => S.bud[k] > 0);
  const over = bk.filter(k => (m.byCat[k] || 0) > S.bud[k]);
  if (over.length) add('bad', '🔴', over.length === 1 ? `${esc(over[0])} is over budget` : `${over.length} categories over budget`,
    over.map(k => `${esc(k)}: ${inr(m.byCat[k])} vs ${inr(S.bud[k])} (+${inr(m.byCat[k] - S.bud[k])})`).join('<br>') +
    (cur ? '<br>Hold off on these for the rest of the month.' : '<br>Cut back next month, or set a limit you can actually keep.'));

  if (cur && el >= 5 && bk.length) {
    const lim = sum(bk, k => S.bud[k]), used = sum(bk, k => m.byCat[k] || 0), proj = used / el * D;
    if (proj > lim * 1.05 && used < lim) add('warn', '📈', 'On pace to overshoot your budgets', `At this rate budgeted categories will reach about ${inr(proj)} against ${inr(lim)} planned. Staying under ${inr((lim - used) / (D - el + 1))} a day from here keeps you on track.`);
  }

  let wantTop = '';
  if (m.income > 0 && m.b.W / m.income > 0.3) {
    wantTop = Object.keys(m.byCat).filter(k => catOf(k).b === 'W').sort((a, b) => m.byCat[b] - m.byCat[a])[0];
    add('warn', '🛍️', `Wants are ${Math.round(m.b.W / m.income * 100)}% of income`, `The 50/30/20 rule keeps wants under 30%. Your biggest is ${esc(wantTop)} at ${inr(m.byCat[wantTop])} — trimming it by a quarter frees about ${inr(m.byCat[wantTop] * 0.25 * 12)} a year.`);
  }

  const flex = Object.keys(m.byCat).filter(k => !FIXED.has(k) && catOf(k).b !== 'S').sort((a, b) => m.byCat[b] - m.byCat[a]);
  if (flex.length && m.spent > 0 && flex[0] !== wantTop && m.byCat[flex[0]] / m.spent > 0.3) {
    const k = flex[0], v = m.byCat[k];
    add('info', '🔍', `${esc(k)} is ${Math.round(v / m.spent * 100)}% of your spending`, `A 15% cut here saves about ${inr(v * 0.15)} a month — ${inr(v * 0.15 * 12)} a year.`);
  }

  if (m.income > 0) {
    const ip = m.invested / m.income * 100;
    const pendSip = cur ? sum(S.rec.filter(r => r.active && catOf(r.category).b === 'S' && recStatus(r).k !== 'paid' && recStatus(r).eff.slice(0, 7) === ym), r => +r.amount) : 0;
    if (!m.invested && pendSip) add('info', '📅', `${inr(pendSip)} of SIPs due later this month`, 'Tap “Yes, paid” when each one goes through so your investing rate stays accurate.');
    else if (!m.invested) add('warn', '🌱', 'Nothing invested this month' + (cur ? ' yet' : ''), 'Even a ₹2,000–5,000 monthly SIP in a diversified index fund builds the habit. Schedule it right after salary day so it happens automatically.');
    else if (ip < 15) add('info', '📈', `Investing ${Math.round(ip)}% of income`, 'Work towards 15–20%. Raising your SIP by 10% every year, in line with your hike, compounds strongly over a decade.');
    else add('good', '💪', `Investing ${Math.round(ip)}% of income`, 'Strong habit. Review your equity–debt mix once a year, and keep 6 months of expenses liquid before taking more risk.');
  }

  const subs = S.rec.filter(r => r.active && catOf(r.category).name === 'Subscriptions');
  if (subs.length) {
    const mo = sum(subs, monthlyCost);
    add('info', '📺', `Subscriptions cost ${inr(mo)} a month`, `That’s ${inr(mo * 12)} a year across ${subs.length} service${subs.length > 1 ? 's' : ''}. Cancel anything you haven’t used in the last 30 days.`);
  }

  const small = m.tx.filter(t => t.type !== 'Income' && +t.amount < 300 && catOf(t.category).b !== 'S');
  if (small.length >= 8) add('info', '☕', `${small.length} small spends added up to ${inr(sum(small, t => +t.amount))}`, 'Snacks, deliveries and quick rides add up quietly. A weekly cap for them is easier than tracking each one.');

  const ps = pastStats(), avgSpend = ps.length ? sum(ps, x => x.spent) / ps.length : 0;
  if (avgSpend > 0) add('info', '🛟', `Emergency fund target: ${inr(Math.round(avgSpend * 6 / 1000) * 1000)}`, `About 6× your average monthly spend of ${inr(avgSpend)}. Keep it in a liquid fund or sweep-in FD — not in equity.`);

  if (!T.length) add('info', '👍', 'Nothing to flag', 'Keep logging — the tips get sharper with more data.');
  const ord = { bad: 0, warn: 1, info: 2, good: 3 };
  return T.sort((a, b) => ord[a[0]] - ord[b[0]]);
}

function pastStats() {
  const cm = thisMonth();
  return [1, 2, 3].map(k => shiftMonth(cm, -k)).filter(ym => S.tx.some(t => String(t.date).slice(0, 7) === ym)).map(monthStats);
}

function vBudget() {
  const ym = S.month, m = monthStats(ym), cur = ym === thisMonth(), D = dim(ym), pace = cur ? +today().slice(8) / D * 100 : 100;
  const bk = Object.keys(S.bud).filter(k => S.bud[k] > 0), lim = sum(bk, k => S.bud[k]), used = sum(bk, k => m.byCat[k] || 0);
  const p = lim ? used / lim * 100 : 0, bd = band(p, pace), R = 42, C = 2 * Math.PI * R;
  let h = `<div class="panel" style="margin-top:6px"><div class="ring-row"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="${R}" fill="none" stroke-width="11" style="stroke:var(--sunk)"/>
      <circle class="seg" cx="50" cy="50" r="${R}" fill="none" stroke-width="11" stroke-linecap="${p > 0 ? 'round' : 'butt'}" data-k="bd-ring" data-da="${(clamp(p) / 100 * C).toFixed(2)} ${C.toFixed(2)}" style="stroke:var(--${bd === 'bad' ? 'red' : bd === 'mid' ? 'amber' : 'green'});stroke-dasharray:${P['bd-ring'] || '0 ' + C.toFixed(2)}"/></svg>
      <b>${N('bd-p', p, 'pct')}</b></div><div style="min-width:0">` +
    (bk.length
      ? `<small class="aside">Spent of budgeted</small><span class="bigv">${N('bd-used', used)}</span><span class="fine" style="display:block;margin:0">of ${inr(lim)} · ${used <= lim ? inr(lim - used) + ' left' : `<b class="neg">${inr(used - lim)} over</b>`}</span>`
      : '<b style="font-size:16px">No limits yet</b><p class="fine">Tap any category below to set a monthly limit. You’ll see an alert when it’s exceeded.</p>') +
    '</div></div></div>';

  const ps = pastStats(), names = CATS.Expense.map(c => c[0]);
  Object.keys(m.byCat).concat(bk).forEach(k => { if (names.indexOf(k) < 0) names.push(k); });
  const rows = names.map(k => ({ k, v: m.byCat[k] || 0, lim: S.bud[k] || 0, a: ps.length ? sum(ps, x => x.byCat[k] || 0) / ps.length : 0 }))
    .sort((a, b) => (!!b.lim - !!a.lim) || (a.lim && b.lim ? b.v / b.lim - a.v / a.lim : 0) || b.v - a.v || b.a - a.a);
  h += `<div class="sec"><h2>Category limits</h2><span class="aside">${monthShort(ym)} spend</span></div><div class="panel" style="padding:2px 16px">` +
    rows.map(x => {
      const c = catOf(x.k), pp = x.lim ? x.v / x.lim * 100 : 0, b2 = band(pp, pace);
      const sub = x.lim ? `${inr(x.v)} of ${inr(x.lim)}${x.a ? ' · avg ' + inrS(x.a) : ''}` : [x.v ? inr(x.v) + ' this month' : '', x.a ? 'avg ' + inr(x.a) : ''].filter(Boolean).join(' · ') || 'No spend yet';
      return `<button class="bud" data-bud="${esc(x.k)}"><div class="bud-top"><div class="ic sm" style="--c:${c.c}">${c.em}</div><div class="rt"><b>${esc(x.k)}</b><small>${sub}</small></div>` +
        (x.lim ? `<span class="pct ${b2}">${Math.round(pp)}%</span>` : '<span class="set">Set</span>') + '</div>' +
        (x.lim ? `<div class="track"><i class="fill ${b2}" ${W('bl-' + x.k, pp)}></i>${cur ? `<span class="pace" style="left:${pace.toFixed(1)}%"></span>` : ''}</div>` : '') + '</button>';
    }).join('') + '</div>';

  return h;
}

function openSheet(id) {
  $$('.sheet.on').forEach(s => { if (s.id !== id) { s.classList.remove('on'); s.style.transform = ''; } });
  const s = $('#' + id); s.scrollTop = 0; s.style.transform = ''; s.classList.add('on');
  $('#scrim').classList.add('on'); document.body.classList.add('lock');
}
function closeSheet() {
  $$('.sheet.on').forEach(s => { s.classList.remove('on'); s.style.transform = ''; });
  $('#scrim').classList.remove('on'); document.body.classList.remove('lock');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function dragSheets() {
  $$('.sheet').forEach(s => {
    let y0 = null, dy = 0;
    s.addEventListener('touchstart', e => {
      const t = e.touches[0];
      y0 = (s.scrollTop <= 0 && t.clientY - s.getBoundingClientRect().top < 60) ? t.clientY : null; dy = 0;
    }, { passive: true });
    s.addEventListener('touchmove', e => {
      if (y0 == null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      if (dy > 4) { s.classList.add('drag'); s.style.transform = `translate(-50%,${dy}px)`; }
    }, { passive: true });
    s.addEventListener('touchend', () => {
      if (y0 == null) return;
      y0 = null; s.classList.remove('drag');
      if (dy > 90) closeSheet(); else s.style.transform = '';
    });
  });
}

/* ---------- add / edit transaction (also the shake quick-add) ---------- */

function wire() {
  $$('.tabbar [data-tab]').forEach(b => b.addEventListener('click', () => { haptic(6); go(b.dataset.tab); }));
  $('#fab').addEventListener('click', () => { haptic(10); openAdd({}); });
  $('#m-prev').addEventListener('click', () => { S.month = shiftMonth(S.month, -1); render(); });
  $('#m-next').addEventListener('click', () => { if (S.month < thisMonth()) { S.month = shiftMonth(S.month, 1); render(); } });
  $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSheet();
    if (e.key === 'Enter' && e.target.id === 'a-amt') { e.preventDefault(); saveAdd(); }
  });
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-go],[data-tx],[data-pay],[data-snz],[data-rec],[data-addrec],[data-bud]');

  });

  chipGroup('#a-cats', v => { A.category = v; markOn('#a-cats', v); });

  chipGroup('#a-mode', v => { A.mode = v; markOn('#a-mode', v); });

  $('#a-save').addEventListener('click', saveAdd);

  chipGroup('#z-opts', v => { zDate = v; paintSnooze(); });

  chipGroup('#r-presets', v => {
    const p = PRESETS[+v], nm = $('#r-name');
    if (!nm.value.trim() || PRESETS.some(x => x.name === nm.value.trim())) nm.value = p.name;
    R.category = p.category; R.every = p.every; markOn('#r-presets', v); paintRec(); centerOn('#r-cats');
  });
  chipGroup('#r-cats', v => { R.category = v; markOn('#r-cats', v); });
  chipGroup('#r-every', v => { R.every = +v; markOn('#r-every', v); });
  chipGroup('#r-mode', v => { R.mode = v; markOn('#r-mode', v); });
  $('#r-save').addEventListener('click', saveRecSheet);
  $('#r-del').addEventListener('click', delRec);
  $('#r-pay').addEventListener('click', () => openPay(R.id));

  chipGroup('#b-sugg', v => { $('#b-amt').value = v; markOn('#b-sugg', v); });
  $('#b-save').addEventListener('click', saveBud);
  $('#b-clear').addEventListener('click', clearBud);

  dragSheets();
  window.addEventListener('online', flush);
  window.addEventListener('offline', () => { if (MODE && !onDevice()) setSync('offline'); });
  document.addEventListener('visibilitychange', onVis);
  wireSecurity();
}

      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 120000, hash: 'SHA-256' }, k, 256);

}

    ['[Content_Types].xml', `${X}<Types xmlns="${PKG}content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="${CT}sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="${CT}styles+xml"/>` +
      names.map((n, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="${CT}worksheet+xml"/>`).join('') + '</Types>'],
    ['_rels/.rels', `${X}<Relationships xmlns="${PKG}relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `${X}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${REL}"><sheets>` +
      names.map((n, i) => `<sheet name="${n}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', `${X}<Relationships xmlns="${PKG}relationships">` +
      names.map((n, i) => `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +
      `<Relationship Id="rId${names.length + 1}" Type="${REL}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', XSTYLES]
  ].concat(names.map((n, i) => [`xl/worksheets/sheet${i + 1}.xml`, xsheet(XCOLS[n], data[n], !i)])));
}
async function exportXlsx() {
  const name = `Money-Tracker-${today()}.xlsx`;
  try {
    const blob = new Blob([buildXlsx()], { type: XTYPE });
    /* iPhone can't save a download from an installed app, so hand the file to the share sheet (Save to Files / Drive) */
    const file = IOS && window.File ? new File([blob], name, { type: XTYPE }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
    else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    toast('Couldn’t create the Excel file', true); return;
  }
  store.set('mt-exported', today()); renderSettings();
  toast('Excel file downloaded');
}

function wireSecurity() {
  $('#gear').addEventListener('click', () => { haptic(6); openSettings(); });
  $('#set-body').addEventListener('click', onSettings);
  $('#set-body').addEventListener('change', e => { if (e.target.id === 's-bio') toggleBio(e.target.checked, e.target); });
  $('#lock').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b && !b.disabled) lockKey(b.dataset.k); });
  $('#lock').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lk-url') { e.preventDefault(); lockKey('connect'); } });
  document.addEventListener('keydown', e => {
    if ($('#lock').hidden || PIN_STEPS.indexOf(L.step) < 0) return;
    if (/^\d$/.test(e.key)) { e.preventDefault(); lockKey(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); lockKey('del'); }
  });
}
function onVis() {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  hiddenAt = 0;
  if (unlocked && AUTH.token && away > LOCK_AFTER) { lockApp(AUTH.v ? 'unlock' : 'login'); return; }
  if (!unlocked) { L.bioTried = false; autoBio(); return; }
  render();
  if (Date.now() - lastLoad > 30000) load();
}

/* ============================== start ============================== */
const LOCK_AFTER = 60000;
function params(cb) {
  try { if (GAS && google.script.url) { google.script.url.getLocation(l => cb((l && l.parameter) || {})); return; } } catch (e) {}
  const p = {};
  try { new URLSearchParams(location.search).forEach((v, k) => { p[k] = v; }); } catch (e) {}
  cb(p);
}
function startMode(status) {
  if (AUTH.m !== MODE) { AUTH = { m: MODE }; saveAuth(); }
  Object.assign(S, { tx: [], rec: [], bud: {}, url: '', sheetUrl: '', sheetEmail: '', ready: false, month: thisMonth() });
  Q = onDevice() ? [] : (store.get('mt-q', []) || []);
  const c = store.get(cacheKey(), null);
  if (c && Array.isArray(c.tx)) Object.assign(S, { tx: c.tx, rec: c.rec || [], bud: c.bud || {}, url: c.url || '', sheetUrl: c.sheetUrl || '', sheetEmail: c.sheetEmail || '', ready: true });
  else if (MODE === 'demo') { Object.assign(S, demoData()); S.ready = true; persist(); }
  else if (MODE === 'local') S.ready = true;
  if (MODE === 'local' && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); // ask the browser not to evict the data
  setSync(MODE === 'demo' ? 'demo' : Q.length ? (navigator.onLine ? 'saving' : 'offline') : 'loading');
  go('home');
  if (AUTH.token && AUTH.v) { lockApp('unlock'); return; }
  if (onDevice()) { lockApp('create'); return; }
  if (status) { lockApp(status.hasPin ? 'login' : 'create'); return; }
  lockApp('wait');
  rpc('status').then(r => step(r.hasPin ? 'login' : 'create'), e => step('offline', isNet(e) ? 'Check your internet connection.' : String(e.message || e)));
}
function init() {
  wire();
  bioAvailable().then(v => { BIO_OK = v; if (L.step === 'unlock') { renderLock(); autoBio(); } });
  params(p => {
    if (!('quick' in p || 'add' in p)) return;
    pendingQuick = { quick: true, type: /^inc/i.test(p.type || '') ? 'Income' : 'Expense' };
    if (!GAS) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    consumeQuick();
  });
  MODE = GAS ? 'gas' : apiUrl ? 'api' : store.get('mt-mode', '') === 'demo' ? 'demo' : 'local';
  startMode();
}
init();
